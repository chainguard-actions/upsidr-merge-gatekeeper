name: Test timeout behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Get current HEAD SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record start time
        id: start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          self: merge-gatekeeper
          ref: ${{ steps.sha.outputs.sha }}
          interval: "5"
          timeout: "5"

      - name: Assert action completed within a reasonable time (respects timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          START: ${{ steps.start.outputs.start }}
        run: |
          echo "outcome: $OUTCOME"
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed seconds: $ELAPSED"
          # The action should complete (success or failure) within ~60s given a 5s timeout
          if [ "$ELAPSED" -gt 60 ]; then
            echo "FAIL: action took too long ($ELAPSED seconds), timeout may not be respected"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded within timeout"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed/timed out gracefully within expected time"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
