name: Test basic usage with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          self: merge-gatekeeper
          interval: "1"
          timeout: "5"
          ignored: ""
          ref: "main"
      - name: Assert action was invoked
        run: |
          echo "Action completed (with or without error, token input was covered)"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: token input was provided and action was invoked"
