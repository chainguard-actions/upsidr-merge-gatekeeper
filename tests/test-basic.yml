name: Test basic usage - merge gatekeeper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          self: merge-gatekeeper
          interval: "5"
          timeout: "10"
          ref: "HEAD"
      - name: Assert action ran (token input covered)
        run: |
          echo "Action completed (with or without error - token input was provided)"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: token input was covered"
